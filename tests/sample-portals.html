<!doctype html><html lang="ja"><meta charset="utf-8"><title>Sample portals browser tests</title>
<h1>Sample portals browser tests</h1><pre id="results">RUNNING</pre><iframe id="portal" title="テスト対象" style="width:390px;height:1100px"></iframe>
<script>
'use strict';
const frame=document.querySelector('#portal'), results=[];
const doc=()=>frame.contentDocument, $=selector=>doc().querySelector(selector), all=selector=>[...doc().querySelectorAll(selector)];
const check=(name,ok)=>{results.push({name,pass:!!ok});if(!ok)throw new Error(name);};
const load=path=>new Promise(resolve=>{frame.addEventListener('load',resolve,{once:true});frame.src=path;});
const reload=()=>new Promise(resolve=>{frame.addEventListener('load',resolve,{once:true});frame.contentWindow.location.reload();});
const input=(selector,value)=>{const el=$(selector);el.value=value;for(const type of ['input','change'])el.dispatchEvent(new frame.contentWindow.Event(type,{bubbles:true}));};
const reset=async(name)=>{await load('../src/samples/'+name+'/index.html');frame.contentWindow.localStorage.setItem('tsumugu-sample-'+name+'-v1','{broken json');await reload();check(name+' recovers corrupt state without disabling storage',$(name==='playbook'?'#save-warning':'#storage-warning').hidden);};
const run=async(name,fn)=>{try{await fn();}catch(error){results.push({name:name+' error',pass:false,error:error.stack});}};
(async()=>{
 await run('gallery',async()=>{
  await load('../samples.html');
  for(const name of ['playbook','academy','shelf'])check('gallery links '+name,!!$('a[href="src/samples/'+name+'/index.html"]'));
  check('gallery fits mobile',doc().documentElement.scrollWidth<=390);
 });
 await run('playbook',async()=>{
  await reset('playbook');
  check('playbook renders procedures',all('.procedure-row').length>=4);
  input('#playbook-search','経費');check('playbook search',all('.procedure-row').length===1&&$('.procedure-row').textContent.includes('経費'));
  input('#playbook-search','存在しない000');check('playbook empty guidance',!$('#empty-state').hidden);
  $('#reset-search').click();check('playbook reset',all('.procedure-row').length>=4);
  $('.category-filter[data-category=development]').click();check('playbook category filter',all('.procedure-row').length>0&&all('.procedure-row').length<6);
  $('[data-shortcut=expense]').click();check('playbook shortcut opens procedure',$('#checklist-title').textContent.includes('経費'));
  $('.procedure-check').click();check('playbook checklist records progress',$('.completion-status').textContent.includes('1 /'));
  await reload();check('playbook checklist persists',$('.procedure-check').checked);
  check('playbook fits mobile',doc().documentElement.scrollWidth<=390);
  check('playbook links comparison',!!$('a[href="../../../samples.html"]'));
  frame.contentWindow.localStorage.removeItem('tsumugu-sample-playbook-v1');
 });
 await run('academy',async()=>{
  await reset('academy');
  check('academy renders courses',all('#course-grid .course-card').length===3);
  input('#academy-search','存在しない000');check('academy search guidance',!$('#empty-state').hidden);
  $('#clear-search').click();check('academy reset',all('#course-grid .course-card').length===3);
  $('[data-course-id=c1]').click();check('academy opens learning workspace',!$('#workspace-view').hidden&&all('#lesson-tree li').length===3);
  $('.quiz-options input[value="1"]').click();$('#check-answer').click();check('academy wrong answer stays incomplete',$('#course-progress').value===0);
  $('.quiz-options input[value="0"]').click();$('#check-answer').click();check('academy right answer completes lesson',$('#course-progress').value===1);
  const title=$('#lesson-title').textContent;$('#next-lesson').click();check('academy next follows sequence',$('#lesson-title').textContent!==title);
  await reload();check('academy learning persists',$('#total-completed').textContent==='1');
  $('[data-course-id=c1]').click();check('academy restored course progress',$('#course-progress').value===1);
  check('academy workspace fits mobile',doc().documentElement.scrollWidth<=390);
  check('academy links comparison',!!$('a[href="../../../samples.html"]'));
  frame.contentWindow.localStorage.removeItem('tsumugu-sample-academy-v1');
 });
 await run('shelf',async()=>{
  await reset('shelf');
  check('shelf renders resources',all('#resource-grid .resource-card').length===12);
  input('#shelf-search','経費');check('shelf keyword search',all('#resource-grid .resource-card').length===1);
  input('#shelf-search','存在しない000');check('shelf empty guidance',!$('#empty-state').hidden);
  $('#reset-filters').click();check('shelf reset',all('#resource-grid .resource-card').length===12);
  $('[data-collection=technology]').click();check('shelf collection filters',all('#resource-grid .resource-card').length===3);
  $('#reset-filters').click();input('#type-filter','動画');check('shelf type filters',all('#resource-grid .resource-card').length===3);
  $('#reset-filters').click();$('#list-view').click();check('shelf list view toggles',$('#resource-grid').classList.contains('list-layout'));
  $('#resource-grid .save-button').click();$('#read-later').click();check('shelf read later filters',all('#resource-grid .resource-card').length===1);
  $('#resource-grid .resource-title').click();check('shelf detail opens',$('#resource-dialog').open);
  $('#close-dialog').click();await reload();check('shelf bookmark persists',$('#saved-count').textContent==='1');
  $('#read-later').click();check('shelf persisted item visible',all('#resource-grid .resource-card').length===1);
  check('shelf fits mobile',doc().documentElement.scrollWidth<=390);
  check('shelf links comparison',!!$('a[href="../../../samples.html"]'));
  frame.contentWindow.localStorage.removeItem('tsumugu-sample-shelf-v1');
 });
 document.querySelector('#results').textContent=(results.every(r=>r.pass)?'PASS':'FAIL')+'\n'+JSON.stringify(results,null,2);
})();
</script></html>
