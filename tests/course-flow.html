<!doctype html>
<html lang="ja"><meta charset="utf-8"><title>Course builder and confirmation tests</title>
<h1>Course builder and confirmation tests</h1><pre id="results">RUNNING</pre>
<iframe id="portal" src="../index.html" title="テスト対象" style="width:390px;height:1200px"></iframe>
<script>
'use strict';
const frame=document.querySelector('#portal'), results=[];
const check=(name,ok)=>{results.push({name,pass:!!ok});if(!ok)throw new Error(name);};
const nextLoad=()=>new Promise(resolve=>frame.addEventListener('load',resolve,{once:true}));
frame.addEventListener('load',async function run(){
 try {
  const win=frame.contentWindow;
  // Destructive to this browser profile's demo state: use a dedicated test profile.
  win.localStorage.setItem('tsumugu-v1',JSON.stringify({resources:[],bookmarks:[],progress:{c1:['r1']}}));
  let loaded=nextLoad();win.location.reload();await loaded;
  let doc=frame.contentDocument;
  const input=(selector,value,scope=doc)=>{const el=scope.querySelector(selector);el.value=value;el.dispatchEvent(new win.Event('input',{bubbles:true}));el.dispatchEvent(new win.Event('change',{bubbles:true}));};
  const saved=()=>JSON.parse(win.localStorage.getItem('tsumugu-v1'));
  const submit=()=>doc.querySelector('#course-form').dispatchEvent(new win.Event('submit',{bubbles:true,cancelable:true}));
  const moveButton=(row,text)=>[...row.querySelectorAll('button')].find(b=>b.textContent.includes(text)||b.getAttribute('aria-label')?.includes(text));
  const openCustom=title=>[...doc.querySelectorAll('.course-card')].find(b=>b.textContent.includes(title)).click();
  doc.querySelector('#create-course').click();
  check('course builder opens',doc.querySelector('#course-dialog').open);
  input('#course-title','検証用・順番と確認問題');
  submit();check('empty course is rejected',!doc.querySelector('#course-form-error').hidden);
  input('#course-confirmation','quiz');
  for(const id of ['r1','r2']){input('#course-resource-select',id);doc.querySelector('#course-add-step').click();}
  check('two resources selected',doc.querySelectorAll('#course-draft-steps>li').length===2);
  submit();check('incomplete quizzes cannot be saved',doc.querySelector('#course-dialog').open&&!doc.querySelector('#course-form-error').hidden);
  [...doc.querySelectorAll('.quiz-editor')].forEach((editor,index)=>{
   input('[data-field=question]','確認問題 '+index,editor);
   for(let n=0;n<3;n++)input('[data-field=option-'+n+']','選択肢 '+n,editor);
   input('[data-field=answer]','0',editor);
  });
  moveButton(doc.querySelectorAll('#course-draft-steps>li')[1],'上').click();
  check('resources reorder upward',doc.querySelector('#course-draft-steps>li').textContent.includes('はじめての環境セットアップ'));
  check('questions remain with their resource on reorder',doc.querySelector('.quiz-editor [data-field=question]').value==='確認問題 1');
  check('builder fits mobile viewport',doc.querySelector('#course-dialog').scrollWidth<=doc.querySelector('#course-dialog').clientWidth+1);
  submit();check('quiz course saves',!doc.querySelector('#course-dialog').open);
  let custom=saved().courses[0];
  check('specified order is persisted',custom.steps.join(',')==='r2,r1');
  check('existing progress is retained',saved().progress.c1.join(',')==='r1');
  const model=win.PortalModel, ids=win.PORTAL_DATA.resources.map(r=>r.id);
  check('unknown course resources rejected',!model.validSavedCourse({...custom,steps:['missing']},ids,[]));
  check('duplicate course resources rejected',!model.validSavedCourse({...custom,steps:['r1','r1']},ids,[]));
  openCustom(custom.title);
  check('quiz has no completion checkbox bypass',doc.querySelectorAll('.course-steps input[type=checkbox]').length===0);
  let step=doc.querySelector('.course-steps li');
  step.querySelectorAll('input[type=radio]')[1].click();step.querySelector('.quiz-answer-button').click();
  check('wrong answer does not complete step',!(saved().progress[custom.id]||[]).includes('r2'));
  check('wrong answer gives feedback',step.querySelector('.quiz-feedback').textContent.trim().length>0);
  step.querySelectorAll('input[type=radio]')[0].click();step.querySelector('.quiz-answer-button').click();
  check('correct answer completes step',saved().progress[custom.id].includes('r2'));
  doc.querySelector('#content-dialog').close();
  loaded=nextLoad();win.location.reload();await loaded;doc=frame.contentDocument;
  openCustom(custom.title);
  check('course order survives reload',doc.querySelector('.course-steps li').textContent.includes('はじめての環境セットアップ'));
  check('quiz completion survives reload',saved().progress[custom.id].includes('r2')&&doc.querySelector('.course-status').textContent.includes('1 / 2'));
  doc.querySelector('#content-dialog').close();
  doc.querySelector('#create-course').click();input('#course-title','検証用・本人チェック');input('#course-confirmation','self');
  input('#course-resource-select','r3');doc.querySelector('#course-add-step').click();submit();
  check('self confirmation course saves',!doc.querySelector('#course-dialog').open);
  openCustom('検証用・本人チェック');doc.querySelector('.course-steps input[type=checkbox]').click();
  check('self confirmation completes step',Object.values(saved().progress).some(list=>list.includes('r3')));
  win.localStorage.removeItem('tsumugu-v1');
  document.querySelector('#results').textContent='PASS\n'+JSON.stringify(results,null,2);
 }catch(error){document.querySelector('#results').textContent='FAIL\n'+error.stack+'\n'+JSON.stringify(results,null,2);}
},{once:true});
</script></html>
