<!doctype html>
<html lang="ja"><meta charset="utf-8"><title>Portal browser smoke test</title>
<style>body{font:14px monospace}iframe{width:1440px;height:1000px;border:1px solid #ddd}pre{white-space:pre-wrap}</style>
<h1>Browser smoke test</h1><pre id="results">RUNNING</pre><iframe id="portal" src="../index.html" title="テスト対象のポータル"></iframe>
<script>
'use strict';
const frame = document.querySelector('#portal');
const results = [];
const check = (name, condition) => { results.push({name, pass: !!condition}); if (!condition) throw new Error(name); };
const nextLoad = () => new Promise(resolve => frame.addEventListener('load', resolve, {once:true}));
const tick = () => new Promise(resolve => setTimeout(resolve, 100));
frame.addEventListener('load', async function run() {
  try {
    const win = frame.contentWindow;
    // The test profile is disposable; never point this harness at a working browser profile.
    win.localStorage.clear();
    let loaded = nextLoad(); win.location.reload(); await loaded;
    let doc = frame.contentDocument;
    const input = (selector, value) => { const el=doc.querySelector(selector); el.value=value; el.dispatchEvent(new win.Event('input',{bubbles:true})); el.dispatchEvent(new win.Event('change',{bubbles:true})); };
    check('initial resources rendered', doc.querySelector('#resource-grid').children.length >= 6);
    check('three learning courses', doc.querySelector('#course-grid').children.length === 3);
    input('#search', '経費'); await tick();
    check('Japanese keyword search', doc.querySelector('#resource-grid').textContent.includes('経費精算') && !doc.querySelector('#resource-grid').textContent.includes('チームハンドブック'));
    input('#search','存在しない資料0000'); await tick();
    check('empty search guidance', !doc.querySelector('#empty-state').hidden);
    doc.querySelector('#reset-filters').click(); await tick();
    check('reset restores resources', doc.querySelector('#resource-grid').children.length >= 6);
    doc.querySelector('#category-nav .nav-item').click();
    doc.querySelector('#type-tabs .type-tab:nth-child(4)').click();
    check('combined category and video filter', doc.querySelectorAll('.resource-card').length === 1 && doc.querySelector('.resource-title').textContent === '情報セキュリティの基本');
    doc.querySelector('#main-nav .nav-item:nth-child(2)').click();
    doc.querySelector('#type-tabs .type-tab').click();
    doc.querySelector('.bookmark-button').click();
    check('bookmark toggles', doc.querySelector('.bookmark-button').getAttribute('aria-pressed') === 'true');
    doc.querySelector('#main-nav .nav-item:last-child').click();
    check('bookmark view', doc.querySelectorAll('.resource-card').length === 1);
    doc.querySelector('#main-nav .nav-item').click();
    doc.querySelector('.course-card').click();
    check('ordered course opens', doc.querySelectorAll('.course-steps li').length === 3);
    doc.querySelector('.course-steps input').click();
    check('course completion updates', doc.querySelector('.course-status').textContent.includes('1 / 3'));
    doc.querySelector('#content-dialog').close();
    doc.querySelector('#add-button').click();
    check('add dialog opens', doc.querySelector('#add-dialog').open);
    input('[name=title]', 'ブラウザ検証用資料');
    input('[name=url]', 'javascript:alert(1)');
    doc.querySelector('#add-form').dispatchEvent(new win.Event('submit', {bubbles:true,cancelable:true}));
    check('unsafe URL is rejected', !doc.querySelector('#form-error').hidden && doc.querySelector('#add-dialog').open);
    input('[name=url]', 'https://example.com/portal-test');
    input('[name=description]', '<img src=x onerror=alert(1)>');
    doc.querySelector('#add-form').requestSubmit(); await tick();
    check('add closes dialog', !doc.querySelector('#add-dialog').open);
    input('#search', 'ブラウザ検証用資料'); await tick();
    check('added link is searchable', doc.querySelector('#resource-grid').textContent.includes('ブラウザ検証用資料'));
    check('input is rendered as text', !doc.querySelector('#resource-grid img'));
    loaded=nextLoad(); win.location.reload(); await loaded; doc=frame.contentDocument;
    check('bookmark persists', JSON.parse(win.localStorage.getItem('tsumugu-v1')).bookmarks.length === 1);
    doc.querySelector('.course-card').click();
    check('course completion persists', doc.querySelector('.course-steps input').checked);
    doc.querySelector('#content-dialog').close();
    input('#search', 'ブラウザ検証用資料'); await tick();
    check('added link persists after reload', doc.querySelector('#resource-grid').textContent.includes('ブラウザ検証用資料'));
    input('#search',''); await tick();
    frame.style.width='390px'; await tick();
    check('mobile has no horizontal overflow', doc.documentElement.scrollWidth <= 390);
    check('unsafe protocol validation', win.PortalModel.safeUrl('data:text/html,test') === null && win.PortalModel.safeUrl('https://user:pass@example.com') === null);
    loaded=nextLoad(); win.localStorage.setItem('tsumugu-v1','{broken json'); win.location.reload(); await loaded; doc=frame.contentDocument;
    check('malformed saved data does not disable storage', doc.querySelector('#storage-warning').hidden);
    win.localStorage.clear();
    document.querySelector('#results').textContent='PASS\n'+JSON.stringify(results,null,2);
  } catch(error) { document.querySelector('#results').textContent='FAIL\n'+error.stack+'\n'+JSON.stringify(results,null,2); }
}, {once:true});
</script></html>
